name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt
          # 锁定 black/isort 版本，使其格式化规则与本地一致（避免新版 black 规则变更导致 CI lint 失败）
          pip install "black==24.4.2" "isort==5.13.2" "pytest>=7"

      - name: Check format (black)
        run: black --check .

      - name: Check imports (isort)
        run: isort --check-only .

      - name: Syntax check all python
        run: |
          find code -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Run from-scratch smoke tests
        run: |
          python code/01-traditional-ml/linear_regression_gd.py
          python code/01-traditional-ml/kmeans_scratch.py

      - name: Run pytest suite
        run: pytest -q
